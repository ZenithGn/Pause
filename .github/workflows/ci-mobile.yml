name: CI/CD – Mobile App (Android Kotlin)

on:
  push:
    branches:
      - main
      - mobile-app_dev
    tags:
      - "v*"
    paths:
      - "app/mobile/**"
      - ".github/workflows/ci-mobile.yml"
  pull_request:
    branches:
      - main
      - mobile-app_dev
    paths:
      - "app/mobile/**"
      - ".github/workflows/ci-mobile.yml"
  workflow_dispatch:
    inputs:
      build_release:
        description: "Build signed/unsigned Release APK & AAB"
        type: boolean
        default: false

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

jobs:
  test-and-build-debug:
    name: Unit Tests, Lint & Debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Decode google-services.json (if configured)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
            echo "google-services.json decoded for FCM."
          else
            echo "GOOGLE_SERVICES_JSON_BASE64 not set; building without google-services plugin."
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests, Android Lint & assemble Debug APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://placeholder.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID || '' }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME || '' }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET || '' }}
          PAYOS_CLIENT_ID: ${{ secrets.PAYOS_CLIENT_ID || '' }}
          PAYOS_API_KEY: ${{ secrets.PAYOS_API_KEY || '' }}
          PAYOS_CHECKSUM_KEY: ${{ secrets.PAYOS_CHECKSUM_KEY || '' }}
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-unit-test-report
          path: app/mobile/app/build/reports/tests/testDebugUnitTest
          retention-days: 14

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pause-android-debug-apk
          path: app/mobile/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  release-android:
    name: Build Release APK & Play Store AAB
    needs: test-and-build-debug
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.build_release == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app/mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode google-services.json (if configured)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          fi

      - name: Decode Android signing keystore (if configured)
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-keystore.jks
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "ANDROID_KEYSTORE_BASE64 not set; building unsigned release artifacts."
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release APK & AAB
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          PAYOS_CLIENT_ID: ${{ secrets.PAYOS_CLIENT_ID }}
          PAYOS_API_KEY: ${{ secrets.PAYOS_API_KEY }}
          PAYOS_CHECKSUM_KEY: ${{ secrets.PAYOS_CHECKSUM_KEY }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            ./gradlew :app:assembleRelease :app:bundleRelease \
              -Pandroid.injected.signing.store.file="$PWD/release-keystore.jks" \
              -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD" \
              --stacktrace
          else
            ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace
          fi

      - name: Upload Release APK & AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pause-android-release-${{ github.ref_name }}
          path: |
            app/mobile/app/build/outputs/apk/release/*.apk
            app/mobile/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Publish GitHub Release (on version tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/mobile/app/build/outputs/apk/release/*.apk
            app/mobile/app/build/outputs/bundle/release/*.aab
