# Supabase local development configuration – Pause
# Ref: https://supabase.com/docs/guides/local-development/cli/config
#
# Usage:
#   supabase start          # boot local stack (Docker required)
#   supabase db reset       # apply migrations + seed
#   supabase db push        # push migrations to the linked remote project

project_id = "pause"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
# Deep link scheme used by the Android app for password recovery / email confirmation.
site_url = "pause://auth-callback"
additional_redirect_urls = [
  "pause://auth-callback",
  "http://localhost:3000/auth/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
# FR-01.2: client tracks 5 failed attempts / 15 minutes lock.
# Supabase Auth also rate limits sign-in attempts server-side (see [auth.rate_limit]).
# Keys verified against supabase/cli (pkg/config/auth.go): minimum_password_length
# and password_requirements are both valid TOML keys.
minimum_password_length = 8
password_requirements = "letters_digits"

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
# Templates include both the magic link and the 6-digit OTP so the Android app
# can support link-less recovery as a fallback.
secure_password_change = true

# NOTE: email template content_path is resolved relative to the REPO ROOT
# (CLI: `filepath.Dir(SupabaseDirPath)`), unlike notification templates which are
# relative to `supabase/`. Hence the leading `supabase/` segment.
[auth.email.template.confirmation]
subject = "Xác nhận tài khoản Pause của bạn"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Đặt lại mật khẩu Pause"
content_path = "./supabase/templates/recovery.html"

[auth.external.google]
enabled = true
# Credentials are injected from the environment – never commit real secrets.
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
redirect_uri = "http://127.0.0.1:54321/auth/v1/callback"
skip_nonce_check = false

[auth.rate_limit]
# Server-side brute-force protection for FR-01.2.
email_sent = 2
sign_in_sign_ups = 30
token_refresh = 150
token_verifications = 30

[analytics]
enabled = false
